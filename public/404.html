<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BizFlow - Modern Business Management Software</title>
    <script>
      // SPA Fallback for GitHub Pages static hosting
      var pathSegments = window.location.pathname.split('/').filter(Boolean);
      var basePath = pathSegments.length > 0 ? '/' + pathSegments[0] + '/' : '/';
      window.location.replace(basePath);
    </script>
  </head>
  <body style="font-family: sans-serif; padding: 2rem; color: #334155; text-align: center;">
    <h2>Redirecting to BizFlow...</h2>
    <p>If you are not redirected automatically, <a id="redirect-link" href="./" style="color: #2563eb;">click here</a>.</p>
    <script>
      var pathSegments = window.location.pathname.split('/').filter(Boolean);
      var basePath = pathSegments.length > 0 ? '/' + pathSegments[0] + '/' : '/';
      document.getElementById('redirect-link').href = basePath;
    </script>
  </body>
</html>
