    <script>
      // SPA Fallback for GitHub Pages static hosting
      var path = window.location.pathname;
      var repo = '/Bizflow-software';

        window.location.replace(repo + '/');
      } else {
        window.location.replace('/Bizflow-software/');
      }

  </head>
